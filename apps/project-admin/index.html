<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>project-admin</title>
    <!-- GitHub Pages 不支援真正的 SPA fallback（所有未知路徑都導回 index.html），
         這段配合 public/404.html 的轉址，把 404.html 編碼進查詢字串的原始路徑還原回網址列，
         讓 vue-router 可以正確讀到實際要導覽的路徑。純靜態託管（非 GitHub Pages）或本機開發
         時沒有 404.html 介入，這段不會進到 if 分支，完全不影響正常導覽。
         來源：https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
